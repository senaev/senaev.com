name: CV PDF

on:
  push:
    branches: ["**"]
    paths:
      - "app/(iframes)/cv/**"
      - "public/cv/**"
      - "const/**"
      - "components/**"
      - "scripts/render-cv-pdf.mjs"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: v24.14.0
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Render the CV pages to PDF
        run: |
          npx next start -p 3000 &
          npx --yes wait-on --timeout 60000 http://localhost:3000/cv/5min
          node scripts/render-cv-pdf.mjs http://localhost:3000 cv-pdf
      - name: Extract the PDF text, as an ATS reads it
        run: |
          sudo apt-get install -y poppler-utils
          for f in cv-pdf/*.pdf; do
            echo "== $f: $(pdfinfo "$f" | grep Pages)"
            pdftotext -layout "$f" "${f%.pdf}.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv-pdf/
